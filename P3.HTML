<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Algoritma Problem P3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        input, button {
            padding: 8px 12px;
            font-size: 16px;
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f4f8;
            border-left: 4px solid #1a73e8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Simulasi Algoritma Problem P3</h2>
    <p>Algoritma ini menghitung total langkah jika perulangan berjalan <i>n</i> kali dan di dalamnya ada 3 proses.</p>

    <label for="inputN">Masukkan nilai n (jumlah perulangan):</label><br>
    <input type="number" id="inputN" placeholder="Contoh: 5" min="1">
    <button onclick="jalankanAlgoritma()">Jalankan Algoritma</button>

    <div class="result" id="outputHasil">
        Hasil akan muncul di sini...
    </div>

    <script>
        function jalankanAlgoritma() {
            // 1. Ambil nilai n dari input
            let n = parseInt(document.getElementById('inputN').value);

            // Validasi jika input kosong
            if (isNaN(n) || n <= 0) {
                document.getElementById('outputHasil').innerText = "Harap masukkan angka positif!";
                return;
            }

            let TOTAL_STEPS = 0;

            // 2. Jalankan Perulangan (Sesuai Pseudocode)
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= 3; j++) {
                    // Lakukan aksi/proses
                    TOTAL_STEPS = TOTAL_STEPS + 1;
                }
            }

            // 3. Tampilkan Output
            document.getElementById('outputHasil').innerHTML = 
                `Untuk <b>n = ${n}</b>:<br>` +
                `Total langkah yang dieksekusi: <b>${TOTAL_STEPS} langkah</b> (Rumus: 3 × ${n})`;
        }
    </script>

</body>
</html>
